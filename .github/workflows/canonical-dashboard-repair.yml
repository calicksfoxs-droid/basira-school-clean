name: Canonical Dashboard Repair Verification

on:
  push:
    branches:
      - repair/canonical-dashboard-20260929

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_BACKEND: demo
      BASIRA_APP_SECRET: ci-canonical-dashboard-repair-secret-not-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify release
        run: npm run verify:release
      - name: Production build
        run: npm run build
