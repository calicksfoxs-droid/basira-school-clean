name: Core 1.0 Release Verification

on:
  push:
    branches:
      - release/core-1.0-reset-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_BACKEND: demo
      BASIRA_APP_SECRET: ci-core1-release-verification-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run verify:release
      - name: Build Cloudflare candidate
        run: npm run build:vinext
