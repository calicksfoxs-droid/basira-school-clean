name: Core 1.0 Release Verification

on:
  push:
    branches:
      - release/core-1.0-reset-v2
      - ui/core-1.0
      - ui/stitch-basira-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIRA_BACKEND: demo
      BASIRA_APP_SECRET: ci-core1-release-verification-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run verify:release
      - name: Build Cloudflare candidate
        run: npm run build:vinext
      - name: Phase 1.7 Production Auth live gate
        env:
          BASIRA_BACKEND: supabase
          BASIRA_APP_SECRET: ci-phase17-live-gate-secret-2026-not-for-production
          NEXT_PUBLIC_SUPABASE_URL: https://fhedbrmdrgzvbtjvlgfu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zX1FIs9ZkRatN_k9YTnxew_6dm7TPb8
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASIRA_PHASE17_ADMIN_ID: 68866895-1e1c-4d24-913f-3e1a18c64ff7
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Phase 1.7 live gate skipped: SUPABASE_SERVICE_ROLE_KEY is unavailable in GitHub Actions."
            exit 0
          fi
          npm run test:phase1-7:live
      - name: Audit Cloudflare deployment metadata
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare audit credentials unavailable in GitHub Actions."
            exit 0
          fi
          npx wrangler deployments list --config dist/server/wrangler.json --json > cloudflare-deployments.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("cloudflare-deployments.json","utf8")); console.log(JSON.stringify(x.slice(0,3),null,2));'
      - name: Probe current Production health
        run: |
          body="$(curl --fail --silent --show-error --max-time 20 'https://basira-school-clean.calicksfoxs.workers.dev/api/health?deep=1')"
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true||x.backend!=="supabase"||x.database!=="ready") process.exit(1)' "$body"
