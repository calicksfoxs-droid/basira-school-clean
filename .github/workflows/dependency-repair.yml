name: Dependency Repair Verification

on:
  push:
    branches:
      - repair/dependency-audit-fixes-20260929
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASIRA_BACKEND: demo
      BASIRA_APP_SECRET: dependency-repair-verification-secret-2026
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use current npm 11
        run: npm install --global npm@11.20.0
      - name: Refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Audit after repair
        shell: bash
        run: |
          set +e
          npm audit --json > audit-after.json
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('VULNERABILITY_COUNTS=' + JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via
            }));
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) process.exitCode = 2;
          NODE
          audit_status=$?
          if [ "$audit_status" -eq 2 ]; then
            echo "High/critical vulnerabilities remain after the safe repair."
            exit 2
          fi
          exit 0
      - name: Verify project
        run: npm run verify
      - name: Upload repaired dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-repair-output
          path: |
            package.json
            package-lock.json
            audit-after.json
          if-no-files-found: error
      - name: Finalize repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-audit.yml
          git rm .github/workflows/dependency-repair.yml
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi
          git commit -m "security: finalize zero-vulnerability dependency repair [skip ci]"
          git push origin HEAD:repair/dependency-audit-fixes-20260929
