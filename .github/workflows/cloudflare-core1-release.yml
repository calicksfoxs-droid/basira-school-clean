name: Cloudflare Core 1 Production Release

on:
  push:
    branches:
      - deploy/cloudflare-core1

permissions:
  contents: read

concurrency:
  group: basira-cloudflare-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://fhedbrmdrgzvbtjvlgfu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_zX1FIs9ZkRatN_k9YTnxew_6dm7TPb8
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard required production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - name: Phase 1.7 live Supabase auth gate
        env:
          BASIRA_BACKEND: supabase
          BASIRA_APP_SECRET: ci-phase17-production-gate-secret-not-for-runtime
          BASIRA_PHASE17_ADMIN_ID: 68866895-1e1c-4d24-913f-3e1a18c64ff7
        run: npm run test:phase1-7:live

      - name: Release exact commit to Cloudflare
        run: node scripts/release-cloudflare.mjs
