name: Phase 1.5 Temporary Verify

on:
  push:
    branches:
      - phase1/ownership-membership-integrity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/lib/data/__tests__/demo-store.test.ts src/lib/data/__tests__/supabase-ownership-membership.test.ts
